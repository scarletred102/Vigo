# Vigo Browser CI — Windows Build & Test
#
# This workflow builds vigo-core components and runs unit tests.
# Full Chromium builds require dedicated build machines (2-6 hours).
# This CI focuses on:
#   1. Rust crate compilation + tests + clippy
#   2. C++ linting (clang-format check)
#   3. GN file syntax validation
#   4. Code structure verification

name: Vigo CI

on:
  push:
    branches: [main, code1]
    paths:
      - 'vigo-core/**'
  pull_request:
    branches: [main]
    paths:
      - 'vigo-core/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust: Build + Test + Clippy ─────────────────────────────
  rust:
    name: Rust Crates
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vigo-core/rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vigo-core/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('vigo-core/rust/**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --workspace --check

  # ── C++ Lint ────────────────────────────────────────────────
  cpp-lint:
    name: C++ Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check license headers
        run: |
          # Verify all .cc, .h files have the proprietary license header.
          find vigo-core -name '*.cc' -o -name '*.h' | while read f; do
            if ! head -2 "$f" | grep -q "Copyright (c) 2025 Vigo Browser"; then
              echo "MISSING LICENSE HEADER: $f"
              exit 1
            fi
          done
          echo "✓ All C++ files have license headers"

      - name: Check BUILD.gn exists for source dirs
        run: |
          # Every directory with .cc files should have a BUILD.gn.
          find vigo-core -name '*.cc' -not -path '*/chromium_src/*' | \
            xargs -I{} dirname {} | sort -u | while read dir; do
            if [ ! -f "$dir/BUILD.gn" ]; then
              echo "MISSING BUILD.gn: $dir"
              exit 1
            fi
          done
          echo "✓ All source directories have BUILD.gn"

  # ── Structure Verification ──────────────────────────────────
  structure:
    name: Repo Structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify required directories
        run: |
          for dir in \
            vigo-core/browser \
            vigo-core/chromium_src \
            vigo-core/components/adblock \
            vigo-core/components/media_orchestration \
            vigo-core/components/privacy_engine \
            vigo-core/components/sync \
            vigo-core/components/credential_vault \
            vigo-core/build/config \
            vigo-core/app \
            vigo-core/rust/vigo_adblock \
            vigo-core/rust/vigo_crypto \
            vigo-core/rust/vigo_filter \
            vigo-core/third_party/libsodium \
            vigo-core/patches \
            vigo-core/installer \
            vigo-core/test; do
            if [ ! -d "$dir" ]; then
              echo "MISSING DIRECTORY: $dir"
              exit 1
            fi
          done
          echo "✓ All required directories present"

      - name: Verify root BUILD.gn
        run: test -f vigo-core/BUILD.gn

      - name: Verify Rust workspace
        run: test -f vigo-core/rust/Cargo.toml
