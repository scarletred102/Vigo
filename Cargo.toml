[workspace]
resolver = "2"
members = [
    "crates/vex-core",
    "crates/vex-net",
    "crates/vex-dom",
    "crates/vex-html",
    "crates/vex-css",
    "crates/vex-layout",
    "crates/vex-js",
    "crates/vex-render",
    "crates/vex-media",
    "crates/vex-storage",
    "crates/vex-security",
    "crates/vex-privacy",
    "crates/vex-crypto",
    "crates/vex-sync",
    "crates/vex-browser",
    "crates/vex-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Vigo Team"]
rust-version = "1.75"

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging / tracing
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL handling
url = { version = "2", features = ["serde"] }

# Collections
smallvec = "1"
precomputed-hash = "0.1"

# Regex
regex = "1"
aho-corasick = "1"

# Crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Networking
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
rustls = "0.23"
webpki-roots = "0.26"
http = "1"
bytes = "1"
http-body-util = "0.1"
tower = "0.5"

# Compression
flate2 = "1"
brotli = "7"
zstd = "0.13"

# DNS
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "dns-over-https-rustls"] }

# HTML parsing
html5ever = "0.29"
markup5ever = "0.14"
tendril = "0.4"

# CSS parsing
cssparser = "0.34"
selectors = "0.26"

# Text layout
cosmic-text = "0.12"

# GPU
wgpu = "23"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Image
image = "0.25"

# JS engine
boa_engine = "0.19"
boa_gc = "0.19"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
