version: "3.9"

services:
  vigo-sync:
    build: .
    container_name: vigo-sync-server
    ports:
      - "8443:8443"
    volumes:
      - vigo-sync-data:/app/data
    environment:
      - VIGO_SYNC_PORT=8443
      - VIGO_SYNC_DB_PATH=/app/data/vigo_sync.db
      - VIGO_SYNC_LOG_LEVEL=info
    restart: unless-stopped

volumes:
  vigo-sync-data:
    driver: local
