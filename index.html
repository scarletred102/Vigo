<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vigo Browser</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- ═══════════════ TITLE BAR ═══════════════ -->
  <header id="titlebar">
    <div id="titlebar-drag">
      <div id="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#logoGrad)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
          <defs>
            <linearGradient id="logoGrad" x1="2" y1="2" x2="22" y2="22">
              <stop stop-color="#a78bfa" />
              <stop offset="1" stop-color="#6ee7b7" />
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Vigo</span>
      </div>
    </div>
    <div id="window-controls">
      <button class="win-btn" id="btn-minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect y="5" width="12" height="1.5" rx="0.75" fill="currentColor" />
        </svg>
      </button>
      <button class="win-btn" id="btn-maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="1" y="1" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <button class="win-btn win-btn-close" id="btn-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════ MAIN LAYOUT ═══════════════ -->
  <div id="app">
    <!-- ─── SIDEBAR ─── -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <button class="sidebar-action" id="btn-new-tab" title="New Tab (Ctrl+T)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <button class="sidebar-action" id="btn-search-tabs" title="Search Tabs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>
      <div id="tab-list" class="custom-scroll"></div>
      <div id="sidebar-footer">
        <button class="sidebar-action" id="btn-bookmarks" title="Bookmarks">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" />
          </svg>
        </button>
        <button class="sidebar-action" id="btn-history" title="History">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </button>
        <button class="sidebar-action" id="btn-notes" title="Notes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
        </button>
        <button class="sidebar-action" id="btn-downloads" title="Downloads">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </button>
        <button class="sidebar-action" id="btn-settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- ─── MAIN CONTENT ─── -->
    <main id="main-content">
      <!-- Navigation Bar -->
      <div id="navbar">
        <div id="nav-controls">
          <button class="nav-btn" id="btn-back" title="Back (Alt+Left)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <button class="nav-btn" id="btn-forward" title="Forward (Alt+Right)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
          <button class="nav-btn" id="btn-reload" title="Reload (Ctrl+R)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" />
            </svg>
          </button>
        </div>
        <div id="url-bar-wrapper">
          <div id="url-bar-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </div>
          <input type="text" id="url-bar" placeholder="Search or enter URL — Ctrl+L to focus" spellcheck="false"
            autocomplete="off">
          <div id="url-bar-actions">
            <button class="url-action" id="btn-bookmark-page" title="Bookmark this page">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" />
              </svg>
            </button>
            <button class="url-action" id="btn-reader-mode" title="Reader Mode">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z" />
                <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z" />
              </svg>
            </button>
            <button class="url-action" id="btn-split-view" title="Split View">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="12" y1="3" x2="12" y2="21" />
              </svg>
            </button>
          </div>
        </div>
        <div id="nav-extra">
          <button class="nav-btn" id="btn-adblock" title="Ad Blocker">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            <span id="adblock-badge" class="badge">0</span>
          </button>
          <button class="nav-btn" id="btn-command-palette" title="Command Palette (Ctrl+K)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <polyline points="4 17 10 11 4 5" />
              <line x1="12" y1="19" x2="20" y2="19" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Webview Container -->
      <div id="webview-container"></div>

      <!-- New Tab Page (shown when no URL is loaded) -->
      <div id="newtab-page">
        <div id="newtab-content">
          <div id="newtab-greeting"></div>
          <div id="newtab-clock"></div>
          <div id="newtab-search-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="newtab-search" placeholder="Search the web..." spellcheck="false">
          </div>
          <div id="speed-dial"></div>
          <div id="newtab-tip">
            <span class="key">Ctrl+K</span> Command Palette &nbsp;•&nbsp;
            <span class="key">Ctrl+T</span> New Tab &nbsp;•&nbsp;
            <span class="key">Ctrl+L</span> URL Bar &nbsp;•&nbsp;
            <span class="key">Ctrl+W</span> Close Tab
          </div>
        </div>
      </div>
    </main>

    <!-- ─── RIGHT PANELS (Bookmarks, History, Notes, Downloads, Settings) ─── -->
    <aside id="right-panel" class="panel-hidden">
      <div id="panel-header">
        <h3 id="panel-title"></h3>
        <button class="panel-close" id="btn-close-panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="panel-content" class="custom-scroll"></div>
    </aside>
  </div>

  <!-- ═══════════════ COMMAND PALETTE OVERLAY ═══════════════ -->
  <div id="command-palette" class="overlay-hidden">
    <div id="palette-backdrop"></div>
    <div id="palette-box">
      <div id="palette-search-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="palette-input" placeholder="Type a command, search tabs, bookmarks..." spellcheck="false"
          autocomplete="off">
      </div>
      <div id="palette-results" class="custom-scroll"></div>
    </div>
  </div>

  <!-- ═══════════════ SCRIPTS ═══════════════ -->
  <script src="features/tabs.js"></script>
  <script src="features/command-palette.js"></script>
  <script src="features/adblock.js"></script>
  <script src="features/bookmarks.js"></script>
  <script src="features/downloads.js"></script>
  <script src="features/history.js"></script>
  <script src="features/notes.js"></script>
  <script src="features/reader.js"></script>
  <script src="features/newtab.js"></script>
  <script src="features/shortcuts.js"></script>
  <script src="features/privacy-engine.js"></script>
  <script src="features/memory-manager.js"></script>
  <script src="features/media-orchestrator.js"></script>
  <script src="features/security.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
