<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab — Vigo</title>
  <link rel="stylesheet" href="new_tab_page.css">
</head>
<body>
  <div id="ntp-container">
    <!-- Search bar -->
    <header id="ntp-header">
      <h1 id="ntp-logo">Vigo</h1>
    </header>

    <section id="search-section">
      <form id="search-form" action="https://duckduckgo.com/" method="get">
        <div id="search-wrapper">
          <svg id="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" name="q"
                 placeholder="Search with DuckDuckGo"
                 autocomplete="off" autofocus>
        </div>
      </form>
    </section>

    <!-- Speed dial — most visited sites -->
    <section id="speed-dial">
      <div id="speed-dial-grid">
        <!-- Speed dial tiles are injected by JS -->
      </div>
    </section>

    <!-- Privacy stats bar -->
    <footer id="privacy-stats">
      <div class="stat">
        <span class="stat-value" id="stat-ads-blocked">0</span>
        <span class="stat-label">Ads Blocked</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-trackers-blocked">0</span>
        <span class="stat-label">Trackers Blocked</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-https-upgrades">0</span>
        <span class="stat-label">HTTPS Upgrades</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-time-saved">0s</span>
        <span class="stat-label">Time Saved</span>
      </div>
    </footer>
  </div>

  <script src="new_tab_page.js"></script>
</body>
</html>
