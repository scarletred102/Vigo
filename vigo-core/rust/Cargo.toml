[workspace]
resolver = "2"
members = [
    "vigo_adblock",
    "vigo_crypto",
    "vigo_filter",
]

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Vigo Browser <dev@vigo-browser.com>"]

[workspace.dependencies]
# Shared dependencies across all Vigo Rust crates.
libc = "0.2"

# Cryptographic primitives (RustCrypto + Dalek ecosystem).
# These are the audited, pure-Rust equivalents of libsodium primitives.
# All wrapped by the vigo_crypto crate — the ONLY approved crypto source.
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
